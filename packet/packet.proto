syntax = "proto3";

option go_package = "github.com/hechh/framework/packet";

enum ComponentType {
  CT_NONE   = 0;
  DBPOOL    = 1;   // 数据库连接池
  FWATCHER  = 2;   // 文件监听器
  GC        = 3;   // 垃圾回收器
  HTTPCLI   = 4;  // http.Client模块
  LOGGER    = 5;// 日志
  PPROF     = 6;  // pprof模块
  REDISPOOL = 7;   // redis连接池
  TIMER     = 8;   // 定时器
  ROUTER    = 9;   // 路由器
  NETWORK   = 10;   // 网络服务
  MSGBUS    = 11;  // 消息总线服务
  CLUSTER   = 12;  // 集群服务
}

enum SendType {
  POINT     = 0;
  BROADCAST = 1;
}

// 节点信息
message Node {
  uint32 Type = 1;
  uint32 Id   = 2;
  string Name = 3;
  string Ip   = 4;
  int32  Port = 5;
}

// 包信息
message Packet {
  Head            Head = 1;  // 包头
  bytes           Body = 2;  // 包体
  repeated Router List = 3;  // 路由
}

// 路由信息
message Router {
  uint32             IdType = 1;  // 路由类型
  uint64             Id     = 2;  // 路由ID
  repeated RouteInfo List   = 3;  // 路由信息
}

message RouteInfo {
  uint32 Type = 1;
  uint32 Id   = 2;
}

// 框架核心协议，任何人不能修改
message Head {
  uint32   TraceId       = 1;   // 追踪 id
  int64    CreateTime    = 2;   // 时间
  uint64   Uid           = 3;   // uid
  SendType SendType      = 4;   // 发送类型
  uint32   SrcType       = 5;   // 源地址
  uint32   SrcId         = 6;   // 源地址
  uint32   DstType       = 7;   // 目的地址
  uint32   DstId         = 8;   // 目的地址
  uint32   Cmd           = 9;   // 客户端请求
  uint32   Seq           = 10;  // 请求序列号
  uint32   ActorFunc     = 11;  // 调用的Actor
  uint64   ActorId       = 12;  // actor id
  uint32   SocketId      = 13;  // socketId
  uint32   Version       = 14;  // 版本号
  string   ClientIp      = 15;  // 客户端真实IP地址
  Callback Back          = 16;  // 回调信息
  string   Reply         = 17;  // 同步请求topic
  string   ActorFuncName = 18;  // actorfunc
  int32    Depth         = 19;  // 深度
}

// 回调信息
message Callback {
  uint32 DstType   = 1;  // 目的地址
  uint32 DstId     = 2;  // 目的地址
  uint32 ActorFunc = 3;  // 调用的Actor
  uint64 ActorId   = 4;  // actor id
}

// 响应头信息
message RspHead {
  int32  Code = 1;
  string Msg  = 2;
}

// 消息信息
message Message {
  string Reply = 1;
  bytes  Body  = 2;
}
