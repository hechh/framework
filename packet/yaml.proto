syntax = "proto3";

option go_package = "github.com/hechh/framework/packet";

// NATS 配置
message NatsConfig {
  string PrefixTopic   = 1;  // 订阅主题
  string Endpoints     = 2;  // url地址，多个地址用逗号分隔
  int32  MaxReconnect  = 3;  // 断线最大重连次数，0表示无限重连
  int64  ReconnectWait = 4;  // 重连等待间隔(秒)
  int64  PingInterval  = 5;  // 心跳检测间隔(秒)，0使用默认10秒
  int64  DrainTimeout  = 6;  // 优雅关闭等待超时(秒)，0使用默认60秒
}

// 消息队列配置
message MsgQueueConfig {
  NatsConfig Nats = 1;
}

// ETCD 配置
message EtcdConfig {
  string          PrefixTopic = 1;  // 订阅主题
  repeated string Endpoints   = 2;  // etcd 地址列表
  int64           KeepAlive   = 3;  // 租赁保活时长
}

// 服务发现与注册配置
message DiscoveryConfig {
  EtcdConfig Etcd = 1;
}

// 数据库节点配置
message DbConfig {
  uint32               ShardsId = 1;
  string               DbName   = 2;
  int32                Db       = 3;
  string               User     = 4;
  string               Password = 5;
  string               Ip       = 6;
  int32                Port     = 7;
  string               Prefix   = 8;
  map<int32, DbConfig> Slaves   = 9;
}

// 数据库配置
message MysqlConfig {
  int64             ShardsSize = 1;
  repeated DbConfig Globals    = 2;
  repeated DbConfig Shards     = 3;
}

message RedisConfig {
  int64             ShardsSize = 1;
  repeated DbConfig Globals    = 2;
  repeated DbConfig Shards     = 3;
}

// 配置中心配置
message TableConfig {
  string     ConfPath = 1;  // conf文件目录
  string     XlsxPath = 2;  // 表目录
  string     ConfExt  = 3;  // 表扩展名
  EtcdConfig Etcd     = 4;  // etcd 配置
}

// 公共配置
message CommonConfig {
  string Env         = 1;
  bool   IsOpenPprof = 2;
  string JwtSecret   = 3;
  string AesSecret   = 4;
  uint64 UidModValue = 5;
  int32  PayPort     = 6;
  string GeoDbPath   = 7;  // GeoLite2-City.mmdb 文件路径
}

message LoggerConfig {
  string Mode   = 1;
  string Path   = 2;
  string Level  = 3;
  string Format = 4;
}

// 节点配置
message NodeConfig {
  uint32 Type     = 1;  // 节点类型
  string Name     = 2;  // 节点名字
  uint32 Id       = 3;  // 节点id
  string Ip       = 4;  // ip 地址
  int32  Port     = 5;  // 端口
  string LogLevel = 6;  // 日志等级
  string LogPath  = 7;  // 日志目录
}

